name: Release
on: { push: { tags: ["v*"] } }

# The binaries job creates/updates a GitHub Release, which needs write access
# to repository contents (the default GITHUB_TOKEN is read-only otherwise).
permissions:
  contents: write

jobs:
  crates:
    runs-on: ubuntu-latest
    # OIDC "trusted publishing" for crates.io — no long-lived token in the repo.
    # Requires a trusted publisher configured on crates.io for `keylight-cli`
    # (GitHub repo keylight-dev/keylight-cli, workflow release.yml).
    #
    # NOTE: the crate is `keylight-cli` and the binary is `keylight`. The crate
    # name `keylight` is already the Rust SDK, so this cannot and must not try
    # to claim it. Users still type `keylight` because of the [[bin]] name.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # A release that publishes a broken build is worse than a failed release.
      - run: cargo test --all-targets
      - name: Refuse to release if the tag and Cargo.toml disagree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi
          echo "version $tag matches"
      - name: Authenticate to crates.io (OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Idempotent: succeed if this version is already on crates.io, so a failed
      # release can be re-run without hand-editing anything.
      - name: Publish keylight-cli to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set +e
          out=$(cargo publish 2>&1); code=$?
          echo "$out"
          [ $code -eq 0 ] && exit 0
          echo "$out" | grep -qiE "already (exists|uploaded)" && { echo "already on crates.io"; exit 0; }
          exit $code

  binaries:
    needs: crates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          # Cross-compiled from the arm64 runner. Apple's toolchain does this
          # without a separate linker, so it needs no Intel runner of its own.
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Build for the triple the artifact is named after. Previously this was a
      # bare `cargo build --release`, so every binary was named for a target the
      # build never specified — correct only because each runner happened to be
      # that architecture, and silently wrong the moment two entries shared a
      # runner, which is exactly what adding Intel macOS does.
      - run: cargo build --release --target ${{ matrix.target }}
      # Target-suffixed so the platforms don't collide, and only the executable
      # is uploaded (not .d/.pdb build artifacts).
      #
      # These macOS binaries are NOT signed or notarized, so Gatekeeper will
      # warn on first run. Signing needs an Apple Developer ID certificate;
      # until that exists, do not describe these as verified downloads.
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/keylight${{ matrix.ext }}" "dist/keylight-${{ matrix.target }}${{ matrix.ext }}"
      - name: Extract changelog notes for this tag
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {p=1;print;next} p && /^## \[/ {exit} p {print}' CHANGELOG.md > RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "warning: no CHANGELOG section for $ver" >&2
            echo "See CHANGELOG.md." > RELEASE_NOTES.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: "dist/keylight-${{ matrix.target }}*"
          body_path: RELEASE_NOTES.md

  # Repoint keylight-dev/homebrew-tap at this release. Runs after `binaries`
  # because it checksums the assets that job uploads.
  #
  # A stale tap is worse than no tap: `brew install keylight` would keep
  # installing an old CLI while reporting success. So this job exists to make
  # the tap impossible to forget, not as a convenience.
  homebrew:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pushing to another repository needs a token the default GITHUB_TOKEN
      # cannot provide. Until that secret exists the release must still
      # succeed — failing a published release over packaging would be the
      # wrong trade — so this gates instead of erroring, and says so loudly.
      - name: Check for a tap token
        id: gate
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set — the Homebrew tap was NOT updated and now points at an older release. Set the secret and re-run this job."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tap
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          repository: keylight-dev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Point the formula at this release
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 scripts/update-homebrew-formula.py \
            --version "${GITHUB_REF_NAME#v}" \
            --formula tap/Formula/keylight.rb

      - name: Commit and push the formula
        if: steps.gate.outputs.run == 'true'
        working-directory: tap
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if git diff --quiet; then
            echo "formula already at $ver; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "keylight $ver"
          git push
