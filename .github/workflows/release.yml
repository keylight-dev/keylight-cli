name: Release
on: { push: { tags: ["v*"] } }

# The binaries job creates/updates a GitHub Release, which needs write access
# to repository contents (the default GITHUB_TOKEN is read-only otherwise).
permissions:
  contents: write

jobs:
  crates:
    runs-on: ubuntu-latest
    # OIDC "trusted publishing" for crates.io — no long-lived token in the repo.
    # Requires a trusted publisher configured on crates.io for `keylight-cli`
    # (GitHub repo keylight-dev/keylight-cli, workflow release.yml).
    #
    # NOTE: the crate is `keylight-cli` and the binary is `keylight`. The crate
    # name `keylight` is already the Rust SDK, so this cannot and must not try
    # to claim it. Users still type `keylight` because of the [[bin]] name.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # A release that publishes a broken build is worse than a failed release.
      - run: cargo test --all-targets
      - name: Refuse to release if the tag and Cargo.toml disagree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi
          echo "version $tag matches"
      - name: Authenticate to crates.io (OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Idempotent: succeed if this version is already on crates.io, so a failed
      # release can be re-run without hand-editing anything.
      - name: Publish keylight-cli to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set +e
          out=$(cargo publish 2>&1); code=$?
          echo "$out"
          [ $code -eq 0 ] && exit 0
          echo "$out" | grep -qiE "already (exists|uploaded)" && { echo "already on crates.io"; exit 0; }
          exit $code

  binaries:
    needs: crates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # Target-suffixed so the three platforms don't collide, and only the
      # executable is uploaded (not .d/.pdb build artifacts).
      #
      # These macOS binaries are NOT signed or notarized, so Gatekeeper will
      # warn on first run. Signing needs an Apple Developer ID certificate;
      # until that exists, do not describe these as verified downloads.
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/keylight${{ matrix.ext }}" "dist/keylight-${{ matrix.target }}${{ matrix.ext }}"
      - name: Extract changelog notes for this tag
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {p=1;print;next} p && /^## \[/ {exit} p {print}' CHANGELOG.md > RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "warning: no CHANGELOG section for $ver" >&2
            echo "See CHANGELOG.md." > RELEASE_NOTES.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: "dist/keylight-${{ matrix.target }}*"
          body_path: RELEASE_NOTES.md
