name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: Serialized tests that mutate process-global env vars
        run: cargo test -- --ignored --test-threads=1
      # The coverage guard is what keeps the command surface honest as the API
      # grows, so it gets named explicitly rather than hiding inside the run
      # above — a silent regression here is the one this repo most cares about.
      - name: Every API endpoint is reachable from a command
        run: cargo test --test coverage -- --nocapture
