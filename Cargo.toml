[package]
name = "keylight-cli"
description = "Keylight management CLI — configure apps, key types, licenses, and payment integrations from the terminal"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/keylight-dev/keylight-cli"
authors = ["Keylight <dev@keylight.dev>"]
readme = "README.md"
keywords = ["keylight", "licensing", "cli", "management"]
categories = ["command-line-utilities"]

[[bin]]
name = "keylight"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json", "tls"] }
thiserror = "1"
open = "5"
dirs = "5"
toml = "0.8"
# The setup check activates through the real SDK, so malformed leases and
# signing-key mismatches fail here instead of being hidden by a hand-rolled call.
keylight = "0.3.5"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
